name: Build, Test and Release Magica Dial App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # CRITICAL: This allows the pipeline to create a release

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --clean --collect-all customtkinter --copy-metadata customtkinter main.py

    - name: Smoke Test (Verify Startup)
      shell: powershell
      run: |
        $process = Start-Process -FilePath "dist/main.exe" -PassThru
        Start-Sleep -Seconds 8
        if ($process.HasExited) {
            Write-Host "Error: App crashed immediately!"
            exit 1
        } else {
            Write-Host "Success: App is stable."
            Stop-Process -Id $process.Id -Force
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: success() # Only run if the build and test passed
      with:
        tag_name: v2.1.${{ github.run_number }}
        name: Magica Dial App Release v2.1.${{ github.run_number }}
        body: |
          Automated build from commit ${{ github.sha }}.
          
          **Changes:**
          - Improved UI with History Cards
          - GitHub Profile Integration
          - Persistent Data Storage
        files: dist/main.exe