name: Build, Test and Manual Release

on:
  push:
    branches:
      - main # Or master
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version Number (e.g., v2.2.0)'
        required: true
        default: 'v2.2.0'
      release_notes:
        description: 'What is new in this release?'
        required: false
        default: 'Minor bug fixes and improvements.'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --clean --icon=images/icon.ico --collect-all customtkinter --copy-metadata customtkinter main.py

    - name: Smoke Test (Verify Startup)
      shell: powershell
      run: |
        $process = Start-Process -FilePath "dist/main.exe" -PassThru
        Start-Sleep -Seconds 8
        if ($process.HasExited) {
            Write-Host "Error: App crashed immediately!"
            exit 1
        } else {
            Write-Host "Success: App is stable."
            Stop-Process -Id $process.Id -Force
        }

    # This step ONLY runs if you triggered the workflow MANUALLY via the button
    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_version }}
        name: Magica Dial App ${{ github.event.inputs.release_version }}
        body: ${{ github.event.inputs.release_notes }}
        files: dist/main.exe